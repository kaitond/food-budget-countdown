<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>食費カウントダウン</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食費">
<style>
  :root{
    --bg:#0f1216; --card:#171c22; --card2:#1e242c; --line:#2a323c;
    --text:#eef2f6; --sub:#94a3b8; --dim:#64748b;
    --ok:#34d399; --warn:#fbbf24; --ng:#f87171; --accent:#60a5fa;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button,.chip,.toggle,.attach,label{touch-action:manipulation}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    padding:max(16px, calc(10px + env(safe-area-inset-top))) calc(14px + env(safe-area-inset-right))
            calc(64px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    max-width:520px; margin:0 auto; font-size:15px; line-height:1.6;
  }
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;
       min-height:44px;margin-bottom:14px}
  .top h1{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{
    background:var(--card); border:1px solid var(--line); color:var(--sub);
    width:44px;height:44px;border-radius:13px;font-size:19px;cursor:pointer;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation; user-select:none;
  }
  .iconbtn:active{background:var(--accent);color:#0b1220;border-color:var(--accent)}
  .badge{
    font-size:10.5px;color:var(--dim);border:1px solid var(--line);background:var(--card);
    padding:3px 9px;border-radius:99px;white-space:nowrap;margin-left:auto;
    max-width:42%;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;
  }
  .badge.on{color:var(--ok);border-color:#1f4a3c}
  .badge.off{color:var(--warn);border-color:#4a3d1f}

  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .weeknav .label{flex:1;text-align:center;font-size:13px;color:var(--sub)}
  .weeknav .label b{display:block;color:var(--text);font-size:15px;font-weight:600}

  .hero{
    background:linear-gradient(160deg,var(--card2),var(--card));
    border:1px solid var(--line); border-radius:22px; padding:22px 20px 18px; text-align:center;
  }
  .hero .cap{font-size:12px;color:var(--sub);letter-spacing:.08em}
  .amount{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 2px;
          font-variant-numeric:tabular-nums;transition:color .3s}
  .amount .yen{font-size:26px;font-weight:700;margin-right:2px;opacity:.7}
  .sub{font-size:12.5px;color:var(--sub)}
  .bar{height:9px;border-radius:99px;background:#0b0e12;margin:16px 0 10px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px;transition:width .45s ease,background .3s}
  .heromini{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 8px;text-align:center}
  .tile .t{font-size:10.5px;color:var(--dim);letter-spacing:.04em}
  .tile .v{font-size:17px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

  .days{display:flex;gap:5px;align-items:flex-end;height:74px;margin-top:14px;
        background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .day .col{width:100%;background:#2b3542;border-radius:5px;min-height:3px;transition:height .3s}
  .day .col.over{background:var(--ng)}
  .day .col.has{background:var(--accent)}
  .day .d{font-size:9.5px;color:var(--dim)}
  .day.today .d{color:var(--text);font-weight:700}

  .sec{margin-top:22px}
  .sec>h2{font-size:12px;color:var(--dim);margin:0 0 8px;font-weight:600;letter-spacing:.08em}

  .input{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .amt{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .amt span{font-size:22px;color:var(--dim)}
  .amt input{flex:1;background:none;border:none;outline:none;color:var(--text);
    font-size:32px;font-weight:700;width:100%;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--sub);
    padding:7px 12px;border-radius:99px;font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:700}
  .row{display:flex;gap:8px}
  .row input[type=date],.row input[type=text]{
    flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:9px 11px;font-size:13.5px;outline:none;font-family:inherit;min-width:0}
  .attach{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;
    background:var(--card2);border:1px dashed var(--line);border-radius:10px;
    padding:9px;font-size:12.5px;color:var(--sub);cursor:pointer}
  .attach.hasimg{border-style:solid;border-color:var(--accent);color:var(--accent)}
  .btn{width:100%;margin-top:10px;padding:14px;border:none;border-radius:13px;
    background:var(--ok);color:#05271b;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn:active{opacity:.85}
  .btn[disabled]{background:var(--card2);color:var(--dim);cursor:default}
  .btn.sub2{background:var(--card2);color:var(--text);border:1px solid var(--line);font-weight:700}

  .list{display:flex;flex-direction:column;gap:8px}
  .dayhead{font-size:11.5px;color:var(--dim);margin:8px 2px 0}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:13px;padding:10px 12px}
  .item .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  .item .ic img{width:100%;height:100%;object-fit:cover;border-radius:10px}
  .item .m{flex:1;min-width:0}
  .item .m b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .m small{color:var(--dim);font-size:11.5px}
  .item .p{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
  .item .x{background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer;
    width:34px;height:34px;flex:0 0 auto;border-radius:9px}
  .item .x:active{background:var(--card2);color:var(--ng)}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:26px 0}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .mask.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:20px 18px calc(30px + env(safe-area-inset-bottom));
    max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
  .sheet h3{margin:0 0 16px;font-size:16px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
  .field input[type=number],.field input[type=text],.field select{
    width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
    color:var(--text);padding:12px;font-size:16px;outline:none;font-family:inherit}
  .switch{display:flex;align-items:center;justify-content:space-between;
    background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .switch small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  .toggle{width:46px;height:27px;border-radius:99px;background:#39414d;position:relative;
    cursor:pointer;flex:0 0 auto;transition:background .2s}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .2s}
  .toggle.on{background:var(--ok)}
  .toggle.on::after{transform:translateX(19px)}
  .minibtns{display:flex;gap:8px;margin-top:4px}
  .minibtns button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--sub);
    border-radius:11px;padding:11px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .danger{color:var(--ng)!important;border-color:#4a2530!important}
  .hr{height:1px;background:var(--line);margin:20px 0}
  .note{font-size:11.5px;color:var(--dim);line-height:1.6;margin:8px 0 0}
  .codebox{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;color:var(--accent)}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;
    justify-content:center;z-index:30;padding:18px}
  .viewer.on{display:flex}
  .viewer img{max-width:100%;max-height:100%;border-radius:12px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#242c36;border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:12px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40;max-width:88%;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  #bootfix{position:fixed;inset:0;z-index:50;background:rgba(15,18,22,.96);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:28px;text-align:center}
  #bootfix b{font-size:16px}
  #bootfix span{font-size:13px;color:var(--sub);line-height:1.7;max-width:340px}
  #bootfix button{background:var(--ok);color:#05271b;border:none;border-radius:13px;
    padding:14px 26px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <h1>🍚 食費カウントダウン</h1>
  <span class="badge" id="badge">この端末のみ</span>
  <button class="iconbtn" id="btnSet" title="設定">⚙</button>
</div>

<div class="weeknav">
  <button class="iconbtn" id="prevW">‹</button>
  <div class="label"><b id="wTitle">—</b><span id="wRange">—</span></div>
  <button class="iconbtn" id="nextW">›</button>
</div>

<div class="hero">
  <div class="cap">今週あと使える食費</div>
  <div class="amount" id="remain"><span class="yen">¥</span>0</div>
  <div class="sub" id="remainSub">—</div>
  <div class="bar"><i id="barFill" style="width:0%"></i></div>
  <div class="heromini"><span id="usedTxt">使った ¥0</span><span id="budgetTxt">週予算 ¥0</span></div>
</div>

<div class="grid3">
  <div class="tile"><div class="t">1日あたり</div><div class="v" id="perDay">¥0</div></div>
  <div class="tile"><div class="t">残り日数</div><div class="v" id="daysLeft">0日</div></div>
  <div class="tile"><div class="t">今月の残り</div><div class="v" id="monthLeft">¥0</div></div>
</div>

<div class="days" id="dayBars"></div>

<div class="sec">
  <h2>使った分を入力</h2>
  <div class="input">
    <div class="amt"><span>¥</span><input type="number" id="inAmount" inputmode="numeric" placeholder="0"></div>
    <div class="chips" id="cats"></div>
    <div class="row">
      <input type="date" id="inDate">
      <input type="text" id="inMemo" placeholder="メモ（店名など）">
    </div>
    <label class="attach" id="attachLabel">
      <span id="attachTxt">📷 レシート写真を添付（任意）</span>
      <input type="file" id="inPhoto" accept="image/*" capture="environment" hidden>
    </label>
    <button class="btn" id="btnAdd" disabled>追加する</button>
  </div>
</div>

<div class="sec">
  <h2>今週の明細 <span id="cnt" style="color:var(--dim)"></span></h2>
  <div class="list" id="list"></div>
</div>

<!-- 設定 -->
<div class="mask" id="mask">
  <div class="sheet">
    <h3>設定</h3>

    <div class="field">
      <label>月の食費予算（円）</label>
      <input type="number" id="setBudget" inputmode="numeric">
    </div>
    <div class="field">
      <label>週の区切り</label>
      <select id="setMode">
        <option value="date">毎月1日から7日ごと（1〜7日 / 8〜14日 …）</option>
        <option value="mon">月曜はじまり（月〜日）</option>
        <option value="sun">日曜はじまり（日〜土）</option>
      </select>
    </div>
    <div class="field">
      <div class="switch">
        <div><b style="font-size:13.5px">先週の余りを繰り越す</b><small>同じ月の中でだけ繰り越します</small></div>
        <div class="toggle" id="setCarry"></div>
      </div>
    </div>
    <div class="field">
      <label>この端末の表示名（明細に表示されます）</label>
      <input type="text" id="setWho" placeholder="例：夫 / 妻 / たろう" maxlength="12">
    </div>

    <div class="hr"></div>

    <!-- 未共有のとき -->
    <div id="shareLocal">
      <div class="field">
        <label>夫婦で共有する</label>
        <button class="btn" id="btnShare">夫婦で共有をはじめる</button>
        <p class="note">共有コードが発行されます。相手の端末でそのコード（または参加用リンク）を開くと、
          入力内容がお互いの画面にリアルタイムで反映されます。</p>
      </div>
      <div class="field">
        <label>すでに相手が共有をはじめている場合</label>
        <input type="text" id="joinCode" placeholder="共有コードを貼り付け" autocapitalize="off" autocomplete="off" spellcheck="false">
        <div class="minibtns"><button id="btnJoin">この共有に参加する</button></div>
      </div>
    </div>

    <!-- 共有中のとき -->
    <div id="shareOn" style="display:none">
      <div class="field">
        <label>共有コード</label>
        <div class="codebox" id="codeText">—</div>
        <div class="minibtns">
          <button id="btnShowCode">表示</button>
          <button id="btnCopy">参加用リンクをコピー</button>
        </div>
        <p class="note">このリンクを知っている人は誰でも閲覧・編集できます。渡す相手にご注意ください。</p>
      </div>
      <div class="field">
        <div class="minibtns"><button id="btnLeave" class="danger">共有を解除する</button></div>
      </div>
    </div>

    <div class="hr"></div>

    <div class="field">
      <label>データ</label>
      <div class="minibtns">
        <button id="btnExport">書き出し</button>
        <button id="btnImport">読み込み</button>
        <button id="btnClear" class="danger">全消去</button>
      </div>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>

    <button class="btn" id="btnSave">保存する</button>
  </div>
</div>

<div class="viewer" id="viewer"><img id="viewerImg" alt="レシート"></div>
<div class="toast" id="toastEl"></div>

<script src="./supabase.js"></script>
<script src="./app.js"></script>
<script>
/* app.js が動かなかったときの自己修復。
   キャッシュ不整合などで JS が止まると、画面は出るのにボタンだけ効かない状態になるため、
   その場で検知して案内する。記録データ（localStorage）は消さない。 */
if (typeof render !== 'function') {
  var d = document.createElement('div');
  d.id = 'bootfix';
  d.innerHTML = '<b>アプリを読み込めませんでした</b>'
    + '<span>保存されているファイルが壊れている可能性があります。'
    + '下のボタンで直ります。記録したデータは消えません。</span>'
    + '<button type="button" id="bootfixBtn">修復して再読み込み</button>';
  document.body.appendChild(d);
  document.getElementById('bootfixBtn').onclick = function () {
    this.textContent = '修復中…'; this.disabled = true;
    var reload = function () { location.reload(); };
    (navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
      .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
      .then(function () { return window.caches ? caches.keys() : []; })
      .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
      .then(reload, reload);
  };
}
</script>
</body>
</html>
